# ============================================================
# repair — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/repair_v1_0.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Independent skill adapter: train from base model, publish aiodoo-repair.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for repair. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 4
      name: repair
      file: repair_v1_0.jsonl
      dataset_type: repair
      input_adapter: null
      output_adapter: aiodoo-repair

shuffle: true
seed: 42

datasets:
  - name: stage04_repair
    path: repair_v1_0.jsonl
    dataset_type: repair
    protocol_version: "1.0"
    weight: 1.0

stage_catalog:
  - file: repair_v1_0.jsonl
    dataset_type: repair
    record_count: 481
