# ============================================================
# coding — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/coding_v1_0.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Paths below are relative to that version root (not host Linux paths).
#
# Independent skill adapter: train from base model, publish aiodoo-coding.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for coding. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 1
      name: coding
      file: coding_v1_0.jsonl
      dataset_type: coding
      input_adapter: null
      output_adapter: aiodoo-coding

shuffle: true
seed: 42

datasets:
  - name: stage01_coding
    # Workspace: datasets/v1.0.0/coding_v1_0.jsonl
    path: coding_v1_0.jsonl
    dataset_type: coding
    protocol_version: "1.0"
    weight: 1.0

# Sibling dataset files in the same release (each has its own training pack).
stage_catalog:
  - file: coding_v1_0.jsonl
    dataset_type: coding
  - file: planner_v1_0.jsonl
    dataset_type: planner
  - file: execution_dataset.jsonl
    dataset_type: execution
  - file: repair_v1_0.jsonl
    dataset_type: repair
  - file: context_v1_0.jsonl
    dataset_type: context
  - file: conversation_dataset.jsonl
    dataset_type: conversation
  - file: approval_dataset.jsonl
    dataset_type: approval
  - file: evaluation_dataset.jsonl
    dataset_type: evaluation
