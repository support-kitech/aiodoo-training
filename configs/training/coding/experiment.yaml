# ============================================================
# coding — Canonical production training (root)
# ============================================================
# Invoke:
#   python train.py --config configs/training/coding/experiment.yaml
#
# Fragments are composed via include (no duplicated knobs).
# Workspace paths are logical; aiodoo-colab overlays absolute paths via
# AIODOO_COLAB_* environment variables at launch time.
#
# Public training id: coding
# Published adapter:  aiodoo-coding
# Internal id:        EXP-0001 (bookkeeping / migration only — never Drive paths)
# ============================================================

schema_version: "1.0"
name: coding
seed: 42

include:
  # Sibling fragments only — never configs/{training,adaptation,models,datasets}/*
  - dataset.yaml
  - model.yaml
  - training.yaml
  - evaluation.yaml
  - export.yaml

# Public training identity (portable; must not embed host-specific absolute paths)
experiment:
  id: coding
  internal_id: EXP-0001
  title: "AIODOO Production — Progressive Odoo Engineering LM"
  version: "1.0.0"
  owner: aiodoo
  stage: coding

# Framework bookkeeping only — never used for Drive folders or UI labels.
metadata:
  internal_id: EXP-0001

determinism:
  seed: 42
  # True: reproduce fingerprint and resume validity across Colab sessions
  cudnn_deterministic: true
  # False: determinism over micro-benchmark speed on T4
  cudnn_benchmark: false

# Workspace root is set via AIODOO_WORKSPACE_ROOT (required for drive_v1).
# aiodoo-colab sets this explicitly; ArtifactOutputManager rewrites all output
# paths to the canonical Drive layout (see docs/artifact_output_pipeline.md).
workspace:
  layout: drive_v1

tracking:
  # local_jsonl under workspace logs when Colab overlays root_dir
  tracker_type: local_jsonl
  enabled: true
  experiment_name: coding
  # Production: experiments/coding/logs/tracking/ under Drive workspace.
  root_dir: experiments/coding/logs/tracking
  flush_every_n_steps: 20
  nonfatal_sink_errors: true
