# ============================================================
# context — Training (Colab A100 40GB VRAM profile)
# ============================================================
# Hardware envelope: Google Colab A100 (40 GB).
# Progressive stage 5/8 — resume from prior product adapter.
# Dataset: datasets/v1.0.0/context_v1_0.jsonl (50161 records)
#
# Effective batch kept at 16 (was 1×16 on T4): 4×4 on A100 uses free VRAM.
# If OOM: drop to per_device_batch_size=2 / gradient_accumulation_steps=8.
# If VRAM stays <~28 GB: try per_device_batch_size=8 / gradient_accumulation_steps=2.
# ============================================================

training:
  backend: hf_trainer
  num_epochs: 1.0
  logging_steps: 10
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  per_device_batch_size: 4
  gradient_accumulation_steps: 4

adaptation:
  adapter_type: qlora
  strategy: qlora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

scheduler:
  name: cosine
  warmup_ratio: 0.03

gradient:
  max_norm: 1.0
  accumulation_steps: 4

execution:
  device:
    preferred: auto
    allow_cpu_fallback: false
  precision:
    compute: bf16
    load_in_4bit: true
    load_in_8bit: false
  memory:
    activation_checkpointing: true
    allow_cpu_offload: false
  accelerator: none
  resource_planner: torch

precision:
  precision: bf16
  gradient_checkpointing: true

packing:
  backend: concat
  mode: concat
  max_sequence_length: 2048
  max_examples_per_sequence: 8
  overflow: defer
  drop_last: false
  seed: 42
  pad_to_multiple_of: 8

memory_packing:
  target_tokens_per_batch: 2048
  max_padding_ratio: 0.35
  prefer_length_buckets: true
  enable_packed_attention_hints: true

curriculum:
  backend: sequential
  mode: sequential
  stages:
    - context
  seed: 42

sampling:
  backend: identity
  seed: 42
  temperature: 1.0

checkpointing:
  # Production: training/cache/context/checkpoints/ under Drive workspace.
  output_dir: training/cache/context/checkpoints
  save_steps: 200
  save_total_limit: 3
  save_on_failure: true
  validate_on_load: true
  retention: keep_last
  # Fresh skill train from base model. After a Colab interrupt, point at the
  # last same-run checkpoint, e.g.:
  #   resume_from: training/cache/context/checkpoints/checkpoint-200
  # Do NOT chain other product adapters here (composition belongs in aiodoo-model).
  # Prefer a fresh start after switching T4→A100 batch/accum (do not resume
  # step counts from an old 1×16 run unless you intentionally want that).
  resume_from: null

resume:
  policy: strict  # same-run checkpoint compatibility

metrics:
  history_path: experiments/context/metrics/history.jsonl

callbacks:
  names:
    - logging

attn:
  preferred: sdpa
  allow_flash_attention_2: true

distributed:
  enabled: false
  world_size: 1
  num_nodes: 1
  global_rank: 0
  local_rank: 0
