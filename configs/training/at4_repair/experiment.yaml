# AT-4 — Controlled repair skill adapter (production path, not full-scale).
# Isolated from production configs/training/repair/* and from AT-3 coding.
# Does NOT modify controlled_batch_2. Does NOT download foundations.
#
# Invoke:
#   AIODOO_HF_LOCAL_FILES_ONLY=1 PYTHONPATH=. \
#     python3 train.py --config configs/training/at4_repair/experiment.yaml

schema_version: "1.0"
name: at4-repair
seed: 42

dataset_version: "fp2-controlled-2.0.0-tr7"

experiment:
  id: at4-repair
  title: "AT-4 controlled repair skill adapter (FP2 / local Qwen)"
  version: "at4-repair-001"
  owner: aiodoo
  stage: repair

fp2:
  system_training_contract_version: "1.0.0"
  corpus_version: "fp2-controlled-2.0.0-tr7"
  corpus_checksum: "728d9bad313626b470ff155e1211f779b6330758eab57301672a617692e3f227"
  source_pack: "pack_development"
  provider_capability: "repair"
  product_plane: "development"
  split: "train"
  split_version: "fp2-split-1.0.0"
  training_config_id: "at4-repair"
  filter_rule: "metadata.provider_capability==repair AND dataset_type==repair"

model:
  identifier: Qwen/Qwen2.5-Coder-3B-Instruct
  family: qwen
  precision: fp32
  backend: hf_causal
  tokenizer_binding: huggingface
  local_path: ../AIODOO/models/foundations/development/Qwen2.5-Coder-3B-Instruct

adaptation:
  adapter_type: lora
  strategy: lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  backend: hf_trainer
  num_epochs: 1.0
  # 28 repair train examples × batch 1 → 28 optimizer steps
  logging_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  per_device_batch_size: 1
  gradient_accumulation_steps: 1

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_ratio: 0.03

gradient:
  max_norm: 1.0
  accumulation_steps: 1

execution:
  device:
    preferred: cpu
    allow_cpu_fallback: true
  precision:
    compute: fp32
  memory:
    activation_checkpointing: false
  accelerator: none
  resource_planner: static

packing:
  mode: none
  max_sequence_length: 256

determinism:
  seed: 42
  cudnn_deterministic: true
  cudnn_benchmark: false

checkpointing:
  output_dir: artifacts/at4_repair/checkpoints
  save_steps: 14
  save_total_limit: 3

evaluation:
  enabled: false

export:
  enabled: true
  backend: hf_peft
  profile: peft_default
  output_dir: artifacts/at4_repair/export
  export_types:
    - peft_adapter
    - manifest
  require_evaluation: false
  require_pass_for_export: false

datasets:
  shuffle: false
  seed: 42
  datasets:
    - name: at4_repair_train
      path: artifacts/at4_repair/data/repair_train.jsonl
      dataset_type: repair
      protocol_version: "1.0.0"
      record_format: fp2_training_example
      weight: 1.0

tracking:
  tracker_type: null

workspace:
  layout: local

metadata:
  at4: true
  adapter: repair
  provider_capability: repair
  product_plane: development
