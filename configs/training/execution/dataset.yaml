# ============================================================
# execution — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/execution_dataset.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Independent skill adapter: train from base model, publish aiodoo-execution.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for execution. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 3
      name: execution
      file: execution_dataset.jsonl
      dataset_type: execution
      input_adapter: null
      output_adapter: aiodoo-execution

shuffle: true
seed: 42

datasets:
  - name: stage03_execution
    path: execution_dataset.jsonl
    dataset_type: execution
    protocol_version: "1.0"
    weight: 1.0

stage_catalog:
  - file: execution_dataset.jsonl
    dataset_type: execution
    record_count: 5459
