# ============================================================
# planner — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/planner_v1_0.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Independent skill adapter: train from base model, publish aiodoo-planner.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for planner. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 2
      name: planner
      file: planner_v1_0.jsonl
      dataset_type: planner
      input_adapter: null
      output_adapter: aiodoo-planner

shuffle: true
seed: 42

datasets:
  - name: stage02_planner
    path: planner_v1_0.jsonl
    dataset_type: planner
    protocol_version: "1.0"
    weight: 1.0

stage_catalog:
  - file: planner_v1_0.jsonl
    dataset_type: planner
    record_count: 5695
