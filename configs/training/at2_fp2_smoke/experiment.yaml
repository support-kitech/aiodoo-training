# AT-2 — Tiny FP2 smoke (NOT production). Isolated from coding production configs.
# Does not modify controlled_batch_2.
# Invoke (after env setup):
#   AIODOO_HF_LOCAL_FILES_ONLY=1 python train.py --config configs/training/at2_fp2_smoke/experiment.yaml

schema_version: "1.0"
name: at2-fp2-smoke
seed: 7

dataset_version: "fp2-controlled-2.0.0-tr7"

experiment:
  id: at2-fp2-smoke
  title: "AT-2 FP2 TrainingExample smoke (coding plane)"
  version: "at2-smoke-001"
  owner: aiodoo
  stage: coding

fp2:
  system_training_contract_version: "1.0.0"
  corpus_version: "fp2-controlled-2.0.0-tr7"
  corpus_checksum: "728d9bad313626b470ff155e1211f779b6330758eab57301672a617692e3f227"  # replaced at emit time if needed
  source_pack: "pack_development"
  split: "smoke"
  smoke_id: "at2-smoke-001"
  training_config_id: "at2-fp2-smoke"

# Development-plane foundation (FW0) — smoke uses local_files_only via env.
model:
  identifier: deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct
  family: deepseek
  precision: fp32
  backend: hf_causal
  tokenizer_binding: deepseek

adaptation:
  adapter_type: lora
  strategy: lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  backend: hf_trainer
  num_epochs: 1.0
  max_steps: 2
  logging_steps: 1
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.0
  per_device_batch_size: 1
  gradient_accumulation_steps: 1

optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0

scheduler:
  name: cosine
  warmup_ratio: 0.0

gradient:
  max_norm: 1.0
  accumulation_steps: 1

execution:
  device:
    preferred: cpu
    allow_cpu_fallback: true
  precision:
    compute: fp32
  memory:
    activation_checkpointing: false
  accelerator: none
  resource_planner: static

packing:
  mode: none
  max_sequence_length: 256

determinism:
  seed: 7
  cudnn_deterministic: true
  cudnn_benchmark: false

checkpointing:
  output_dir: artifacts/at2_smoke/checkpoints
  save_steps: 1
  save_total_limit: 2

evaluation:
  enabled: false

export:
  enabled: true
  backend: hf_peft
  profile: peft_default
  output_dir: artifacts/at2_smoke/export
  export_types:
    - peft_adapter
    - manifest
  require_evaluation: false
  require_pass_for_export: false

datasets:
  shuffle: false
  seed: 7
  datasets:
    - name: at2_fp2_dev_smoke
      path: artifacts/at2_smoke/data/pack_development_smoke.jsonl
      dataset_type: coding
      protocol_version: "1.0.0"
      record_format: fp2_training_example
      weight: 1.0

tracking:
  tracker_type: null

workspace:
  layout: local

metadata:
  at2_smoke: true
  smoke_id: at2-smoke-001
