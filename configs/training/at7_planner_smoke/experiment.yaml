# AT-7.2 — Planner training-path CPU smoke (NOT full Planner training).
# Uses a deterministic subset of fp2-controlled-2.0.0-tr7 Reasoning Planner pack.
# Does NOT modify controlled_batch_2. Does NOT download foundations.
# Does NOT train Conversation / Approval / Evaluation. Does NOT merge adapters.
#
# Invoke:
#   AIODOO_HF_LOCAL_FILES_ONLY=1 PYTHONPATH=. \
#     python3 train.py --config configs/training/at7_planner_smoke/experiment.yaml

schema_version: "1.0"
name: at7-planner-smoke
seed: 42

dataset_version: "fp2-controlled-2.0.0-tr7"

experiment:
  id: at7-planner-smoke
  title: "AT-7.2 Planner path smoke — 16 examples / 4 steps"
  version: "at7.2-smoke-001"
  owner: aiodoo
  stage: planner

fp2:
  system_training_contract_version: "1.0.0"
  corpus_version: "fp2-controlled-2.0.0-tr7"
  corpus_checksum: "728d9bad313626b470ff155e1211f779b6330758eab57301672a617692e3f227"
  source_pack: "pack_reasoning"
  provider_capability: "planner"
  product_plane: "reasoning"
  split: "train_smoke"
  split_version: "fp2-split-1.0.0"
  training_config_id: "at7-planner-smoke"
  filter_rule: "metadata.provider_capability==planner AND dataset_type==planner"
  source_eligible_count: 657
  source_train_count: 524
  smoke_train_count: 16
  smoke_validation_count: 4
  smoke_id: "at7.2-planner-smoke-001"

model:
  identifier: Qwen/Qwen2.5-Coder-3B-Instruct
  family: qwen
  precision: fp32
  backend: hf_causal
  tokenizer_binding: huggingface
  local_path: ../AIODOO/models/foundations/development/Qwen2.5-Coder-3B-Instruct

adaptation:
  adapter_type: lora
  strategy: lora
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  backend: hf_trainer
  num_epochs: 1.0
  max_steps: 4
  logging_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  per_device_batch_size: 1
  gradient_accumulation_steps: 1

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_ratio: 0.03

gradient:
  max_norm: 1.0
  accumulation_steps: 1

execution:
  device:
    preferred: cpu
    allow_cpu_fallback: true
  precision:
    compute: fp32
  memory:
    activation_checkpointing: false
  accelerator: none
  resource_planner: static

packing:
  mode: none
  max_sequence_length: 256

determinism:
  seed: 42
  cudnn_deterministic: true
  cudnn_benchmark: false

checkpointing:
  output_dir: artifacts/at7_planner/smoke/checkpoints
  save_steps: 2
  save_total_limit: 3

evaluation:
  enabled: false

export:
  enabled: true
  backend: hf_peft
  profile: peft_default
  output_dir: artifacts/at7_planner/smoke/export
  export_types:
    - peft_adapter
    - manifest
  require_evaluation: false
  require_pass_for_export: false

datasets:
  shuffle: false
  seed: 42
  datasets:
    - name: at7_planner_train_smoke
      path: artifacts/at7_planner/smoke/data/planner_train_smoke.jsonl
      dataset_type: planner
      protocol_version: "1.0.0"
      record_format: fp2_training_example
      weight: 1.0

tracking:
  tracker_type: null

workspace:
  layout: local

metadata:
  at72: true
  at7_smoke: true
  adapter: planner
  provider_capability: planner
  product_plane: reasoning
  smoke_id: at7.2-planner-smoke-001
  max_steps: 4
