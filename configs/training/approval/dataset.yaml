# ============================================================
# approval — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/approval_dataset.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Independent skill adapter: train from base model, publish aiodoo-approval.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

# NOTE: Certified Approval v2 subject-decision SFT (17,094 records).
dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for approval. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 7
      name: approval
      file: approval_dataset.jsonl
      dataset_type: approval
      input_adapter: null
      output_adapter: aiodoo-approval

shuffle: true
seed: 42

datasets:
  - name: stage07_approval
    path: approval_dataset.jsonl
    dataset_type: approval
    protocol_version: "1.0"
    weight: 1.0

stage_catalog:
  - file: approval_dataset.jsonl
    dataset_type: approval
    record_count: 17094
