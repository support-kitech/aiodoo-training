# ============================================================
# conversation — Dataset (workspace-relative, no Drive absolute paths)
# ============================================================
# Resolution contract (aiodoo-colab):
#   workspace.datasets / <dataset_version> / <file>
#   e.g. AIODOO/datasets/v1.0.0/conversation_dataset.jsonl
#
# aiodoo-colab sets AIODOO_COLAB_DATASET_PATH to the version root.
# Independent skill adapter: train from base model, publish aiodoo-conversation.
# Product composition (Development / Reasoning) lives in aiodoo-model.
# ============================================================

# NOTE: v1.0.0 currently ships 1 conversation record — expand in a future dataset release.
dataset_version: "v1.0.0"
dataset_root: "v1.0.0"

# Catalog only — does not imply weight chaining across products.
skill_training:
  enabled: true
  description: >
    Independent product adapter for conversation. Trains from the configured base
    model (fresh LoRA). resume_from is for same-run checkpoint recovery only.
  adapter_naming: "aiodoo-{stage_name}"
  stages:
    - stage: 6
      name: conversation
      file: conversation_dataset.jsonl
      dataset_type: conversation
      input_adapter: null
      output_adapter: aiodoo-conversation

shuffle: true
seed: 42

datasets:
  - name: stage06_conversation
    path: conversation_dataset.jsonl
    dataset_type: conversation
    protocol_version: "1.0"
    weight: 1.0

stage_catalog:
  - file: conversation_dataset.jsonl
    dataset_type: conversation
    record_count: 1
