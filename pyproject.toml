# Tooling configuration only.
# This repository is NOT packaged or published.
# Run scripts from the repository root with: python3 <script>.py

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["aiodoo_training"]
# aiodoo_contract is installed editable (PEP 660 import-hook finder), which
# mypy's static resolver cannot follow — point it at the sibling checkout
# directly so `aiodoo_contract.*` imports resolve during type checking.
mypy_path = ["../aiodoo-contract"]

[[tool.mypy.overrides]]
module = ["aiodoo_training.infrastructure.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["transformers.*", "transformers"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["aiodoo_training"]
omit = [
    "aiodoo_training/infrastructure/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
